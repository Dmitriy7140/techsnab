{% if leads %}<div class="scroll"><table><thead><tr><th>Получена</th><th>Клиент</th><th>Телефон</th><th>Продукция</th><th>Статус</th></tr></thead><tbody>
{% for lead in leads %}<tr><td>{{ lead.created_at|date:"d.m.Y H:i" }}</td><td><a href="{% url 'landing:lead_detail' lead.pk %}">{{ lead.name }}</a></td>
<td>{{ lead.phone }}</td><td>{{ lead.cargo|default:"—" }}</td><td><span class="status {{ lead.status }}">{{ lead.get_status_display }}</span></td></tr>{% endfor %}
</tbody></table></div>{% else %}<p class="empty">Заявок нет.</p>{% endif %}
