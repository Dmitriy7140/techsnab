{% extends 'landing/office/base.html' %}
{% block title %}Вход в CRM{% endblock %}
{% block content %}<section class="login panel"><h1>Вход в CRM</h1>
<form method="post" class="stack">{% csrf_token %}{{ form.non_field_errors }}
    <label>Логин{{ form.username }}{{ form.username.errors }}</label>
    <label>Пароль{{ form.password }}{{ form.password.errors }}</label>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="primary">Войти</button>
</form></section>{% endblock %}
