name: techsnab

# production uses a sibling master checkout. MASTER_SOURCE can point to another copy.
x-web: &web
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - |
        import http.client, os
        conn = http.client.HTTPConnection("127.0.0.1", 8000, timeout=4)
        conn.request("HEAD", "/", headers={"Host": os.environ["ALLOWED_HOSTS"].split(",")[0], "X-Forwarded-Proto": "https"})
        raise SystemExit(conn.getresponse().status != 200)
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  production:
    <<: *web
    image: techsnab-production:${PRODUCTION_REVISION:-local}
    build:
      context: ./deploy
      additional_contexts:
        appsrc: ${MASTER_SOURCE:-../master}
    environment:
      ALLOWED_HOSTS: th37.ru,admin.th37.ru
      CSRF_TRUSTED_ORIGINS: https://th37.ru,https://admin.th37.ru
      SECRET_KEY: ${PRODUCTION_SECRET_KEY:?Set the production Django secret}
      PUBLIC_REVIEWS: "1"
      MIGRATE_REVIEWS: "1"
    volumes:
      - production_data:/var/lib/techsnab
      - reviews_data:/var/lib/techsnab-reviews

  staging:
    <<: *web
    image: techsnab-staging:${STAGING_REVISION:-local}
    depends_on:
      production:
        condition: service_healthy
    build:
      context: ./deploy
      additional_contexts:
        appsrc: .
    environment:
      ALLOWED_HOSTS: staging.th37.ru
      CSRF_TRUSTED_ORIGINS: https://staging.th37.ru
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set the staging Django secret}
      PUBLIC_REVIEWS: "1"
    volumes:
      - staging_data:/var/lib/techsnab
      - reviews_data:/var/lib/techsnab-reviews

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: /opt/techsnab/auth/staging-users
        target: /etc/caddy/staging-users
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config

volumes:
  production_data:
  staging_data:
  reviews_data:
  caddy_data:
  caddy_config:
